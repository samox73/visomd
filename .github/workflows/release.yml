name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          # static musl binaries run on every Linux distro regardless of glibc
          - { arch: x86_64, os: linux, runner: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { arch: aarch64, os: linux, runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { arch: aarch64, os: macos, runner: macos-latest, target: aarch64-apple-darwin }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches Cargo.toml version
        run: test "${GITHUB_REF_NAME#v}" = "$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - if: matrix.os == 'linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - run: |
          cp target/${{ matrix.target }}/release/viso .
          strip viso
          mkdir completions
          ./viso --completions bash > completions/viso.bash
          ./viso --completions zsh > completions/_viso
          ./viso --completions fish > completions/viso.fish
          ./viso --completions nushell > completions/viso.nu
          tar czf viso-${{ matrix.arch }}-${{ matrix.os }}.tar.gz viso completions README.md LICENSE-MIT LICENSE-APACHE
      - uses: actions/upload-artifact@v4
        with:
          name: viso-${{ matrix.target }}
          path: viso-${{ matrix.arch }}-${{ matrix.os }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - run: sha256sum *.tar.gz > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            *.tar.gz
            SHA256SUMS
          generate_release_notes: true
